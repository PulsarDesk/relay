[package]
name = "pulsar-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pulsar relay / rendezvous server — assigns device IDs, coordinates P2P hole punching, and relays traffic when direct connection fails."

[lib]
name = "pulsar_relay"
path = "src/lib.rs"

[[bin]]
name = "pulsar-relay"
path = "src/main.rs"

[dependencies]
pulsar-proto.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
# A9: socket2 lets us enlarge SO_RCVBUF/SO_SNDBUF before bind. B6: bincode's
# serialize_into avoids a per-datagram heap alloc on the forward path. Both are
# already in the workspace (and Cargo.lock), so this only widens this crate's view.
socket2.workspace = true
bincode.workspace = true
# B12: ahash for the hot maps — faster than SipHash but still randomly-seeded, so it
# keeps DoS-resistance against attacker-chosen SessionId (unlike a deterministic FxHash).
ahash = "0.8"
clap = { version = "4", features = ["derive", "env"] }
