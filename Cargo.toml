# Pulsar relay / rendezvous server — standalone crate.
#
# Extracted from the Pulsar monorepo. Depends on the shared wire protocol
# (PulsarDesk/pulsar-proto) as a git dependency. This file is both the
# workspace root and the package so `*.workspace = true` inheritance works.
[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.27"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Pulsar contributors"]
rust-version = "1.88"  # sha2 0.11.1 requires 1.88

[workspace.dependencies]
pulsar-proto = { git = "https://github.com/PulsarDesk/pulsar-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
socket2 = { version = "0.6", features = ["all"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
bincode = "1.3"
# v4 relay auth: SHA-256 for the password challenge proof + stateless nonce, HMAC-SHA1
# for RFC 6238 TOTP verification.
sha2 = "0.11"
hmac = "0.13"
sha1 = "0.11"
# TOTP enrollment: render the otpauth:// URI as a scannable QR (SVG for app UIs, unicode
# blocks for the terminal). `image` is left off — we never rasterise.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[package]
name = "pulsar-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pulsar relay / rendezvous server — assigns device IDs, coordinates P2P hole punching, and relays traffic when direct connection fails."

[lib]
name = "pulsar_relay"
path = "src/lib.rs"

[[bin]]
name = "pulsar-relay"
path = "src/main.rs"

[dependencies]
pulsar-proto.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
# A9: socket2 lets us enlarge SO_RCVBUF/SO_SNDBUF before bind. B6: bincode's
# serialize_into avoids a per-datagram heap alloc on the forward path.
socket2.workspace = true
bincode.workspace = true
# B12: ahash for the hot maps — faster than SipHash but still randomly-seeded, so it
# keeps DoS-resistance against attacker-chosen SessionId (unlike a deterministic FxHash).
ahash = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# v4 relay auth (see [workspace.dependencies]).
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
qrcode.workspace = true
